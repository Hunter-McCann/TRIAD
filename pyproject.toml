[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "triad-mode"
version = "0.1.0"
description = "Prototype amateur-radio TRIAD digital mode modem"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pillow",
]

[project.scripts]
triad = "triad.cli:main"

[tool.setuptools.packages.find]
include = ["triad*"]
